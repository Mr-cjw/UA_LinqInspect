groups:
  - name: ua-linqinspect-edge
    rules:
      - alert: QcEdgeDown
        expr: up{job="ua-linqinspect-edge"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "UA LinqInspect Node-RED endpoint is down"
          description: "Prometheus has failed to scrape the edge metrics endpoint for 2 minutes."

      - alert: QcQueueBacklogHigh
        expr: qc_queue_depth{status="pending"} > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "UA LinqInspect pending queue is growing"
          description: "Pending queue depth has remained above 20 for 5 minutes."

      - alert: QcQueueEnqueueRejected
        expr: increase(qc_enqueue_total{outcome="rejected"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "UA LinqInspect SQLite queue rejected a new event"
          description: "The durable queue is at capacity. New events remain unacknowledged in the UA outbox and will be replayed after the queue drains; inspect MES latency, dead letters and queue depth."

      - alert: QcEventOutboxBackpressure
        expr: qc_event_outbox_backpressure > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "UA event outbox has reached its backpressure threshold"
          description: "New inspections and completions can be rejected until Node-RED acknowledges or an operator safely exports/purges pending NG/completion events."

      - alert: QcEventOutboxBacklogHigh
        expr: qc_event_outbox_pending >= qc_event_outbox_high_watermark and qc_event_outbox_pending > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "UA event outbox backlog is above its high-water mark"
          description: "NG/completion events are awaiting acknowledgement; verify Node-RED is running, subscribed and draining its SQLite queue."

      - alert: QcEventOutboxOldestTooOld
        expr: qc_event_outbox_oldest_age_seconds > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Oldest unacknowledged UA event is older than 2 minutes"
          description: "The OPC UA event outbox has not drained for more than two minutes; inspect /qc/status and the Node-RED event subscription."

      - alert: QcEventOutboxStatusStale
        expr: qc_event_outbox_status_age_seconds < 0 or qc_event_outbox_status_age_seconds > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Node-RED has not observed UA outbox status recently"
          description: "The OutboxStatus heartbeat read has failed or is stale; outbox metrics may not reflect server state."

      - alert: QcOldestQueueItemTooOld
        expr: qc_queue_oldest_age_seconds > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Oldest queued MES item is older than 60 seconds"
          description: "The edge queue is not draining at the expected rate."

      - alert: QcDeadLettersGrowing
        expr: delta(qc_dead_letters[15m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "UA LinqInspect dead letters increased"
          description: "At least one new dead letter appeared in the last 15 minutes; inspect /qc/status and edge logs."

      - alert: QcDeliveryRetrySpike
        expr: increase(qc_delivery_total{outcome="retry"}[10m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MES delivery retries are elevated"
          description: "More than five delivery retries occurred in the last 10 minutes."

      - alert: QcHeartbeatDegraded
        expr: max_over_time(qc_heartbeat_failures[5m]) >= 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "OPC UA heartbeat is failing"
          description: "The edge gateway observed three or more consecutive UA heartbeat failures."

      - alert: QcBackupStale
        expr: time() - qc_backup_last_success_timestamp_seconds > 129600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "SQLite online backup is stale"
          description: "No successful SQLite backup has been recorded for more than 36 hours."

      - alert: QcDatabaseWalGrowing
        expr: qc_database_bytes{kind="wal"} > 268435456
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "UA LinqInspect SQLite WAL exceeds 256 MiB"
          description: "The WAL has stayed above 256 MiB for 15 minutes; check long readers, checkpoint failures and disk pressure."

      - alert: QcDiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Filesystem free space is below 10%"
          description: "A monitored filesystem has remained below 10% free space for 10 minutes; protect SQLite, WAL and backup writes."
